[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vmtrader"
version = "0.3.17"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=2.0.0",
    "pandas>=2.2",
    "pytz>=2020.1",
    "seaborn>=0.13",
]
authors = [
    {name="visualmoney", email="visualmoney2@gmail.com"}
]
description = "VMTrader systematic trading engine — backtesting and live execution"
readme = "README.md"
requires-python = ">= 3.10"
# Dual licensed: a user may choose either license. The MIT terms are retained
# because this project derives from the MIT-licensed upstream QSTrader, whose
# notice cannot be removed; Apache-2.0 is offered alongside it for its explicit
# patent grant. Declared as an SPDX expression (PEP 639) rather than classifiers,
# which cannot express a choice between two licenses.
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["backtesting", "systematic trading", "algorithmic trading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
]

[project.urls]
Homepage = "https://github.com/visualmoney/vm-quant-trader"
Issues = "https://github.com/visualmoney/vm-quant-trader/issues"

# Derived from the MIT-licensed QSTrader by Michael Halls-Moore (QuantStart),
# whose upstream has been dormant since 2024-06. See LICENSE-MIT.
Upstream = "https://github.com/mhallsmoore/qstrader"

# These groups are the single declaration of every non-runtime dependency.
# uv reads them directly, and pip 25.1 and later can too, with '--group <name>'.
[dependency-groups]
# Installed by CI, which resolves them from uv.lock.
test = [
    "pytest>=5.2.2",
    "pytest-cov>=2.8.1",
    "ruff>=0.14",
]

# Only needed to download price data for the scripts in examples/.
# Deliberately kept out of the runtime dependencies: yfinance pulls in a
# large HTML-scraping stack that a backtest never uses, and the examples
# are not part of the distributed package.
examples = [
    "yfinance>=1.2.0",
]

# Only needed by the command-line scripts in scripts/, which are run from a
# repository checkout and are not part of the distributed package. No module
# under vmtrader/ imports click, so it does not belong in the runtime
# dependencies.
scripts = [
    "click>=8.0",
]

# uv syncs the 'dev' group by default, so including the other groups here
# keeps 'uv run pytest', 'uv run python examples/download_data.py' and
# 'uv run python scripts/static_backtest.py' working without any extra flags.
dev = [
    {include-group = "test"},
    {include-group = "examples"},
    {include-group = "scripts"},
]

[tool.ruff.lint]
# Reproduces the rule set the retired Travis config ran as
# 'flake8 --ignore E501,F501,W504'. E501 (line length) stays off because the
# codebase predates any line-length policy; F501 is now enabled, since it
# caught a real '%'-escaping bug in dollar_weighted.py. W504 has no ruff
# equivalent and was only ever needed to silence a pycodestyle default.
select = ["E", "W", "F"]
ignore = ["E501"]

# The E1xx/E2xx/E3xx whitespace rules are preview-gated in ruff. Without this
# flag the lint job would be weaker than the flake8 job it replaces. CI installs
# from uv.lock, so the ruff version -- and therefore the preview rule set -- only
# changes when the lockfile is deliberately upgraded.
preview = true


